<nav
  class="navbar navbar-expand-lg bg-body-tertiary"
  [ngClass]="{ scrolled: isScrolled }"
>
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="../../../../assets/img/logoImg.png" alt="logo" />
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Navigation links - only show for authenticated users -->
      <ul class="navbar-nav" *ngIf="isAuthenticated()">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            aria-current="page"
            [routerLink]="['/courses']"
            >الرئيسية</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/homepage']"
            >الدورات التدريبية</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/instructor']"
            >المدربين</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/blogs']"
            >المدونة</a
          >
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/profile']"
            >الملف الشخصي</a
          >
        </li>
      </ul>

      <!-- Authentication Section for Desktop -->
      <div class="d-none d-lg-block me-5">
        <!-- Login Button (when not authenticated) -->
        <button
          *ngIf="!isAuthenticated()"
          class="btn btn-outline-primary login-btn"
          (click)="login()"
          title="تسجيل الدخول"
        >
          <i class="pi pi-sign-in me-2"></i>
          تسجيل الدخول
        </button>

        <!-- User Menu (when authenticated) -->
        <div *ngIf="isAuthenticated()" class="user-menu">
          <div class="user-profile" (click)="toggleUserMenu()">
            <img
              *ngIf="getUserProfileImage()"
              [src]="getUserProfileImage()"
              alt="Profile"
              class="user-avatar"
            />
            <div *ngIf="!getUserProfileImage()" class="user-avatar-placeholder">
              <i class="pi pi-user"></i>
            </div>
            <span class="user-name">{{ getUserName() }}</span>
            <i class="pi pi-chevron-down ms-2"></i>
          </div>

          <!-- User Dropdown Menu -->
          <div class="user-dropdown" [class.show]="showUserMenu">
            <a [routerLink]="['/profile']" class="dropdown-item" (click)="goToProfile()">
              <i class="pi pi-user me-2"></i>
              الملف الشخصي
            </a>
            <a href="#" class="dropdown-item" (click)="logout()">
              <i class="pi pi-sign-out me-2"></i>
              تسجيل الخروج
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Menu -->
    <ul class="navbar-nav d-lg-none">
      <!-- Login Button (when not authenticated) -->
      <li *ngIf="!isAuthenticated()" class="nav-item">
        <a class="nav-link text-primary" (click)="login()">
          <i class="pi pi-sign-in me-2"></i>
          تسجيل الدخول
        </a>
      </li>

      <!-- Logout Button (when authenticated) -->
      <li *ngIf="isAuthenticated()" class="nav-item">
        <a class="nav-link text-danger" (click)="logout()">
          <i class="pi pi-sign-out me-2"></i>
          تسجيل الخروج
        </a>
      </li>
    </ul>
  </div>
</nav>
