<nav
  class="navbar navbar-expand-lg bg-body-tertiary"
  [ngClass]="{ scrolled: isScrolled }"
>
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="../../../../assets/img/logoImg.png" alt="logo" />
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            aria-current="page"
            [routerLink]="['/courses']"
            >الرئيسة</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/homepage']"
            >دوراتي التدريبية</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/instructor']"
            >المدربين</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/blogs']"
            >المدونة</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/favorites']"
            >المفضلة</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLinkActive="active"
            [routerLink]="['/profile']"
            >الملف الشخصي</a
          >
        </li>
      </ul>

      <!-- Logout Button for Desktop -->
      <button
        class="btn btn-outline-danger logout-btn d-none d-lg-block me-3"
        (click)="logout()"
        title="تسجيل الخروج من النظام"
      >
        <i class="pi pi-sign-out me-2"></i>
        تسجيل الخروج
      </button>

      <!-- User Info Display -->
      <div class="user-info d-none d-lg-block me-3">
        <span class="user-name">{{ getUserName() }}</span>
      </div>
    </div>

    <!-- Mobile Menu -->
    <ul class="navbar-nav d-lg-none">
      <li class="nav-item">
        <a class="nav-link text-danger" (click)="logout()">
          <i class="pi pi-sign-out me-2"></i>
          تسجيل الخروج
        </a>
      </li>
    </ul>
  </div>
</nav>
