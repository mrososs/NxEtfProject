<section class="training-courses">
  <div class="container">
    <div class="d-flex justify-content-between gap-5 align-items-center">
      <div class="d-flex flex-column">
        <h2>
          سواء كنت في بداية مسارك الأكاديمي أو تسعى لتطوير مهاراتك في مجال
          تخصصك، ستجد لدينا كل ما تحتاج إليه !.
        </h2>
        <a
          >عرض المناهج
          <img
            src="../../../../assets/svg/arrow-left-color-left.svg"
            alt="arrow"
        /></a>
      </div>
      <h1>استكشف أكثر من 4,000 دورة تدريبية مجانية عبر الإنترنت للطلاب</h1>
    </div>
    <div class="mt-3">
      <div class="row">
        <div class="col-12 col-md-6 col-lg-4 mb-4">
          <div class="mb-4 p-8 flex items-center justify-center">
            <app-course-card
              [course]="{
                title: 'التواصل',
                rating: 4.5,
                level: 'مبتدئ',
                lectures: 12,
                img: 'assets/img/homePagecourse.png',
                instructor: 'الأستاذ أحمد',
                path: '2022_communications-التواصل-scorm12-MU2W_ngE'
              }"
            ></app-course-card>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4 mb-4">
          <div class="mb-4 p-8 flex items-center justify-center">
           <app-course-card
                  [course]="{
                    title: 'انت كمشرف',
                    rating: 4.5,
                    level: 'مبتدئ',
                    lectures: 12,
                    img: 'assets/img/homePagecourse.png',
                    instructor: 'الأستاذ أحمد',
                    path: '2022_you-as-a-supervisor-انت-كمشرف-scorm12-Utnyt5eX'
                  }"
                ></app-course-card>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4 mb-4">
          <div class="mb-4 p-8 flex items-center justify-center">
             <app-course-card
            [course]="{
              title: 'ادارة الوقت',
              rating: 4.5,
              level: 'مبتدئ',
              lectures: 12,
              img: 'assets/img/homePagecourse.png',
              instructor: 'الأستاذ أحمد',
              path: '2022_time-management-إدارة-الوقت-scorm12-A9qTLmpG'
            }"
          ></app-course-card>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
