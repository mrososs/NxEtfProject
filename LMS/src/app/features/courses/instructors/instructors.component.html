<div class="trainer">
  <div class="container">
    <div class="d-flex justify-content-center flex-column align-items-center">
      <h1>مدربو الدورات</h1>
      <p>
        يقدم الدورات نخبة من الخبراء والمحترفين في مجالاتهم، ممن يملكون خبرة
        عملية وأكاديمية واسعة
      </p>
    </div>

    <ng-container *ngIf="instructorsData$ | async as instructors">
      <!-- Loading State -->
      <div *ngIf="instructors === undefined" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">جاري التحميل...</span>
        </div>
        <p class="mt-2">جاري تحميل المدربين...</p>
      </div>

      <!-- Error State -->
      <div
        *ngIf="instructors && instructors.length === 0"
        class="text-center py-5"
      >
        <div class="alert alert-info">
          <h4>لا توجد مدربين متاحين حالياً</h4>
          <p>يرجى المحاولة مرة أخرى لاحقاً</p>
        </div>
      </div>

      <!-- Instructor List -->
      <div class="row" *ngIf="instructors && instructors.length > 0">
        <div
          class="col-12 col-md-6 col-lg-4 mb-4"
          *ngFor="let instructor of instructors"
        >
          <app-instructor-card [instructor]="instructor"></app-instructor-card>
        </div>
      </div>
    </ng-container>
  </div>
</div>
