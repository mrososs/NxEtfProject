<app-banner
  [title]="'الدورات'"
  [back]="'الرئيسية'"
  [here]="'الدورات'"
></app-banner>
<section class="homePage py-5">
  <div class="container">
    <div class="homePage__title">
      <h1>مرحبا بعودتك احمد ياسر</h1>
      <p>هل تريد متابعة منهجك</p>
    </div>
    <div class="homePage__firstCards mt-3 mb-3">
      <div class="row">
        <div class="col-12 col-md-6 col-lg-4 mb-3">
          <app-course-card
            [course]="{
              title: 'التواصل',
              rating: '4.5',
              level: 'مبتدئ',
              lectures: 12,
              img: 'assets/img/homePagecourse.png',
              instructor: 'الأستاذ أحمد',
              path: '2022_communications-التواصل-scorm12-MU2W_ngE'
            }"
          ></app-course-card>
        </div>
        <div class="col-12 col-md-6 col-lg-4 mb-3">
          <app-course-card
            [course]="{
              title: 'ادارة الوقت',
              rating: '4.5',
              level: 'مبتدئ',
              lectures: 12,
              img: 'assets/img/homePagecourse.png',
              instructor: 'الأستاذ أحمد',
              path: '2022_time-management-إدارة-الوقت-scorm12-A9qTLmpG'
            }"
          ></app-course-card>
        </div>
      </div>
    </div>
    <div class="homePage__Courses">
      <div class="row">
        <div class="col-9">
          <div class="freeCourses d-flex justify-content-center">

          </div>
          <div class="mt-3">
            <div class="row mb-3">
              <div class="col-12 col-md-6 col-lg-4 mb-3">

                  [course]="{
                    title: 'ادارة الوقت',

              </div>

                  }"
                ></app-course-card>
              </div>
              <div class="col-12 col-md-6 col-lg-4 mb-3">
                <app-course-card
                  [course]="{
                    title: 'ادارة الوقت',
                    rating: '4.5',

                    img: 'assets/img/homePagecourse.png',

                  }"
                ></app-course-card>
              </div>
              <div class="col-12 col-md-6 col-lg-4 mb-3">
                <app-course-card
                  [course]="{

                  }"
                ></app-course-card>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center" #searchSection>
            <div *ngIf="searchTerm">
              <h1>المناهج المتعلقة ببحثك عن ”{{ searchTerm }}”</h1>
            </div>
          </div>
          <div class="mt-3" *ngIf="searchTerm">
            <div class="row">
              <div class="col-12 col-md-6 col-lg-4 mb-3">
                <app-course-card
                  [course]="{
                    title: 'التواصل',
                    rating: '4.5',
                    level: 'مبتدئ',
                    lectures: 12,
                    img: 'assets/img/homePagecourse.png',
                    instructor: 'الأستاذ أحمد',
                    path: '2022_communications-التواصل-scorm12-MU2W_ngE'
                  }"
                ></app-course-card>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center" #categorySection>
            <div *ngIf="selectedCategories.length">
              <h1>
                المناهج المتعلقة بأختيارك عن ”{{
                  selectedCategories.join(' - ')
                }}”
              </h1>
            </div>
          </div>
          <div class="mt-3" *ngIf="selectedCategories.length">
            <div class="row">
              <div class="col-12 col-md-6 col-lg-4 mb-3">
                <app-course-card
                  [course]="{
                    title: 'التواصل',
                    rating: '4.5',
                    level: 'مبتدئ',
                    lectures: 12,
                    img: 'assets/img/homePagecourse.png',
                    instructor: 'الأستاذ أحمد',
                    path: '2022_communications-التواصل-scorm12-MU2W_ngE'
                  }"
                ></app-course-card>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <h1>المناهج الاعلي تقيم</h1>
          </div>
          <div class="mt-3">
            <div class="row">
              <div class="col-12 col-md-6 col-lg-4 mb-3">
                <app-course-card
                  [course]="{
                    title: 'التواصل',
                    rating: '4.5',
                    level: 'مبتدئ',
                    lectures: 12,
                    img: 'assets/img/homePagecourse.png',
                    instructor: 'الأستاذ أحمد',
                    path: '2022_communications-التواصل-scorm12-MU2W_ngE'
                  }"
                ></app-course-card>
              </div>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="search">
            <app-serach-bar
              [initialSearchTerm]="searchTerm"
              (searchTermChange)="onSearchSectionChange($event)"
            ></app-serach-bar>
          </div>
          <div class="category mt-3">
            <app-course-category
              (selectedCategoriesChange)="onCategoryChange($event)"
            ></app-course-category>
          </div>
          <div class="level mt-3">
            <app-course-level></app-course-level>
          </div>
          <div class="instructor mt-3">
            <app-course-instructor></app-course-instructor>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
