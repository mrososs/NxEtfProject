<p-card [style]="{ overflow: 'hidden' }">
  <ng-template pTemplate="header">
    <img [src]="course.img" alt="Course Image" class="w-full" />
  </ng-template>

  <ng-template pTemplate="title">
    {{ course.title }}
  </ng-template>

  <div class="row d-flex justify-content-between align-items-center">
    <div class="col-6 mb-3">
      <div class="d-flex gap-2">
        <img src="../../../../assets/svg/card/video.svg" alt="video" />
        <span>{{ course.lectures }} محاضره</span>
      </div>
    </div>
    <div class="col-6 mb-3">
      <div class="d-flex justify-content-center gap-2">
        <img src="../../../../assets/svg/card/chart.svg" alt="chart" />
        <span>{{ course.level }}</span>
      </div>
    </div>
    <div class="col-6 mb-3">
      <div class="d-flex gap-2">
        <img src="../../../../assets/svg/card/star.svg" alt="star" />
        <span>(4.2k) {{ course.rating }}</span>
      </div>
    </div>
    <div class="col-6 mb-3">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <img
          class="img-profile"
          src="../../../../assets/img/student img.png"
          alt="student"
        />
        <span>{{ course.instructor.name }}</span>
      </div>
    </div>
  </div>

  <div class="row d-flex justify-content-center">
    <div class="col-md-6">
      <hr class="dotted-line" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-center mt-1">
      <p-button
        label="بدء التعلم"
        styleClass="w-full"
        [routerLink]="['/course-viewer']"
        [queryParams]="{ folder: course.path }"
      ></p-button>
    </div>
  </ng-template>
</p-card>
