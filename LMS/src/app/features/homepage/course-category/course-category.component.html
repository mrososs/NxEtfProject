<div class="categoryFilter">
  <div class="d-flex justify-content-between align-items-center">
    <h1 class="mt-2">التصنيفات</h1>
    <img src="../../../../assets/svg/category.svg" alt="category" />
  </div>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="text-center p-3">
    <p>جاري تحميل التصنيفات...</p>
  </div>

  <!-- Categories list -->
  <div class="checkList" *ngIf="!loading">
    <ul>
      <li *ngFor="let category of categories">
        <p-checkbox
          [(ngModel)]="category.checked"
          [binary]="true"
          (onChange)="onCheckboxChange()"
        ></p-checkbox>
        <div class="category-info">
          <h3>{{ category.label }}</h3>
          <span class="course-count">({{ category.courseCount }} كورس)</span>
        </div>
      </li>
    </ul>
  </div>
</div>
