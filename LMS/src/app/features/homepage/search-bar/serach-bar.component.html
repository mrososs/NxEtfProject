<div class="searchbar">
  <input
    type="text"
    pInputText
    [(ngModel)]="initialSearchTerm"
    (ngModelChange)="onSearchChange($event)"
    placeholder="ابحث عن منهج معين"
  />
  <img
    src="../../../../assets/svg/search-normal.svg"
    alt="searcIcon"
    class="d-none d-lg-block"
  />
</div>
