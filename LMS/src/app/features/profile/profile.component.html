<app-banner
  [title]="'الملف الشخصي'"
  [back]="'الرئيسية'"
  [here]="'الملف الشخصي'"
></app-banner>

<section class="profile-page py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="profile-card">
          <div class="card-header">
            <h2 class="text-center mb-4">
              {{ isEditMode ? 'تعديل الملف الشخصي' : 'إنشاء ملف شخصي جديد' }}
            </h2>
          </div>

          <div class="card-body">
            <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
              <!-- Profile Image -->
              <div class="form-group mb-4">
                <label class="form-label">الصورة الشخصية</label>
                <div class="image-upload-container">
                  <div class="current-image" *ngIf="profileImageUrl">
                    <img
                      [src]="profileImageUrl"
                      alt="Profile Image"
                      class="profile-preview"
                    />
                  </div>
                  <div class="upload-area" *ngIf="!profileImageUrl">
                    <i
                      class="pi pi-user"
                      style="font-size: 3rem; color: #ccc"
                    ></i>
                    <p class="upload-text">اضغط لاختيار صورة</p>
                  </div>
                  <p-fileUpload
                    mode="basic"
                    [auto]="true"
                    accept="image/*"
                    [maxFileSize]="5000000"
                    chooseLabel="اختيار صورة"
                    (onSelect)="onFileSelect($event)"
                    [showCancelButton]="false"
                    [showUploadButton]="false"
                  >
                  </p-fileUpload>
                </div>
              </div>

              <!-- First Name -->
              <div class="form-group mb-3">
                <label for="firstName" class="form-label">الاسم الأول *</label>
                <input
                  id="firstName"
                  type="text"
                  pInputText
                  formControlName="firstName"
                  class="form-control"
                  [class.is-invalid]="
                    profileForm.get('firstName')?.invalid &&
                    profileForm.get('firstName')?.touched
                  "
                  placeholder="أدخل الاسم الأول"
                />
                <div
                  class="invalid-feedback"
                  *ngIf="
                    profileForm.get('firstName')?.invalid &&
                    profileForm.get('firstName')?.touched
                  "
                >
                  {{ getFieldError('firstName') }}
                </div>
              </div>

              <!-- Middle Name -->
              <div class="form-group mb-3">
                <label for="middleName" class="form-label">الاسم الأوسط</label>
                <input
                  id="middleName"
                  type="text"
                  pInputText
                  formControlName="middleName"
                  class="form-control"
                  placeholder="أدخل الاسم الأوسط (اختياري)"
                />
              </div>

              <!-- Last Name -->
              <div class="form-group mb-3">
                <label for="lastName" class="form-label">الاسم الأخير *</label>
                <input
                  id="lastName"
                  type="text"
                  pInputText
                  formControlName="lastName"
                  class="form-control"
                  [class.is-invalid]="
                    profileForm.get('lastName')?.invalid &&
                    profileForm.get('lastName')?.touched
                  "
                  placeholder="أدخل الاسم الأخير"
                />
                <div
                  class="invalid-feedback"
                  *ngIf="
                    profileForm.get('lastName')?.invalid &&
                    profileForm.get('lastName')?.touched
                  "
                >
                  {{ getFieldError('lastName') }}
                </div>
              </div>

              <!-- Description -->
              <div class="form-group mb-4">
                <label for="description" class="form-label">الوصف</label>
                <textarea
                  id="description"
                  pInputTextarea
                  formControlName="description"
                  class="form-control"
                  rows="4"
                  placeholder="أدخل وصفاً مختصراً عن نفسك (اختياري)"
                >
                </textarea>
              </div>

              <!-- Submit Button -->
              <div class="form-group text-center">
                <button
                  type="submit"
                  pButton
                  [disabled]="isLoading || profileForm.invalid"
                  [loading]="isLoading"
                  class="btn btn-primary btn-lg px-5"
                >
                  <i
                    class="pi"
                    [class.pi-user-plus]="!isEditMode"
                    [class.pi-user-edit]="isEditMode"
                  ></i>
                  {{ isEditMode ? 'تحديث الملف الشخصي' : 'إنشاء الملف الشخصي' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Toast Messages -->
<p-toast></p-toast>
