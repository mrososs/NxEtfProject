<app-banner
  [title]="'المدونة'"
  [back]="'الرئيسية'"
  [here]="'المدونة'"
></app-banner>

<section class="container blog">
  <div class="mt-3">
    <!-- Loading state -->
    <div *ngIf="loading" class="loading-container">
      <div class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">جاري التحميل...</span>
        </div>
        <p class="mt-3">جاري تحميل المقال...</p>
      </div>
    </div>

    <!-- Error state -->
    <div *ngIf="error" class="error-container">
      <div class="alert alert-danger" role="alert">
        <h4>خطأ في تحميل المقال</h4>
        <p>حدث خطأ أثناء تحميل المقال. يرجى المحاولة مرة أخرى.</p>
        <button class="btn btn-primary" (click)="loadBlog(blog?.slug || '')">
          إعادة المحاولة
        </button>
      </div>
    </div>

    <!-- Blog content -->
    <div *ngIf="!loading && !error && blog" class="row">
      <div class="col-12 col-lg-8 mb-4">
        <p-card styleClass="blog-details-card">
          <ng-template pTemplate="header">
            <div class="blog-hero-image">
              <img
                src="../../../../assets/img/blogDetails.png"
                alt="blogDetails"
                class="hero-image"
              />
              <div class="hero-overlay">
                <p-tag
                  [value]="getCategory()"
                  severity="info"
                  styleClass="category-tag"
                ></p-tag>
              </div>
            </div>
          </ng-template>

          <ng-template pTemplate="title">
            <div class="blog-header">
              <h1 class="blog-title">{{ blog.title }}</h1>

              <div class="blog-meta">
                <div class="meta-item">
                  <i class="pi pi-calendar"></i>
                  <span>{{ formatDate(blog.published) }}</span>
                </div>
                <div class="meta-item">
                  <i class="pi pi-clock"></i>
                  <span>{{ getReadingTime() }}</span>
                </div>
                <div class="meta-item">
                  <i class="pi pi-user"></i>
                  <span>كاتب المقال</span>
                </div>
              </div>
            </div>
          </ng-template>

          <ng-template pTemplate="content">
            <div class="blog-content">
              <div [innerHTML]="blog.content" class="content-html"></div>
            </div>
          </ng-template>

          <ng-template pTemplate="footer">
            <div class="blog-footer">
              <p-divider></p-divider>

              <div class="author-section">
                <div class="author-info">
                  <p-avatar
                    image="../../../../assets/img/student img.png"
                    size="large"
                    shape="circle"
                  ></p-avatar>
                  <div class="author-details">
                    <h4>كاتب المقال</h4>
                    <p>كاتب محترف في مجال التطوير والتعليم</p>
                  </div>
                </div>

                <p-button
                  label="العودة للمدونة"
                  icon="pi pi-arrow-right"
                  styleClass="p-button-outlined"
                  routerLink="/blogs"
                ></p-button>
              </div>
            </div>
          </ng-template>
        </p-card>
      </div>

      <div class="col-12 col-lg-4">
        <div class="sidebar">
          <p-card header="البحث" styleClass="sidebar-card">
            <app-blog-search></app-blog-search>
          </p-card>

          <p-card header="مدونات ذات صلة" styleClass="sidebar-card mt-3">
            <div class="related-blogs">
              <p class="text-muted">سيتم إضافة المدونات ذات الصلة قريباً</p>
            </div>
          </p-card>
        </div>
      </div>
    </div>
  </div>
</section>
