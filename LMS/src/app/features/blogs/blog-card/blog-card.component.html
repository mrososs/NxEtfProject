<p-card [style]="{ overflow: 'hidden' }">
  <ng-template pTemplate="header">
    <img [src]="blog.img" alt="blog Image" class="w-full" />
  </ng-template>

  <ng-template pTemplate="title">
    {{ blog.title }}
  </ng-template>

  <div class="row d-flex justify-content-between align-items-center">
    <div class="col-3 mb-3">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <img
          class="img-profile"
          src="../../../../assets/img/student img.png"
          alt="student"
        />
        <span>{{ blog.writer }}</span>
      </div>
    </div>
    <div class="col-3 mb-3">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <img
          class="img-profile"
          src="../../../../assets/svg/blog/message-2.svg"
          alt="student"
        />
        <span>{{ blog.comment }}</span>
      </div>
    </div>
    <div class="col-3 mb-3">
      <div class="d-flex justify-content-center align-items-center gap-2">
        <img
          class="img-profile"
          src="../../../../assets/svg/blog/eye.svg"
          alt="student"
        />
        <span>{{ blog.seen }}</span>
      </div>
    </div>
  </div>

  <div class="row d-flex justify-content-center">
    <div class="col-md-6">
      <hr class="dotted-line" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-center mt-1">
      <p-button
        label="الاطلاع عليها"
        styleClass="w-full"
        [routerLink]="['/blogsDetails', blog?.id]"
      ></p-button>
    </div>
  </ng-template>
</p-card>
