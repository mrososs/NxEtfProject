<app-banner
  [title]="'المدونة'"
  [back]="'الرئيسية'"
  [here]="'المدونة'"
></app-banner>

<div class="container">
  <!-- Loading state -->
  <div *ngIf="loading" class="loading-container">
    <div class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">جاري التحميل...</span>
      </div>
      <p class="mt-3">جاري تحميل المدونات...</p>
    </div>
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="error-container">
    <div class="alert alert-danger" role="alert">
      <h4>خطأ في تحميل المدونات</h4>
      <p>حدث خطأ أثناء تحميل المدونات. يرجى المحاولة مرة أخرى.</p>
      <button class="btn btn-primary" (click)="ngOnInit()">
        إعادة المحاولة
      </button>
    </div>
  </div>

  <!-- Blogs list -->
  <div *ngIf="!loading && !error" class="row mt-5">
    <div
      class="col-12 col-md-6 col-lg-4 mb-4"
      *ngFor="let blog of blog$ | async"
    >
      <app-blog-card [blog]="blog"></app-blog-card>
    </div>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="!loading && !error && (blog$ | async)?.length === 0"
    class="text-center py-5"
  >
    <div class="alert alert-info" role="alert">
      <h4>لا توجد مدونات متاحة</h4>
      <p>لا توجد مدونات متاحة حالياً. يرجى العودة لاحقاً.</p>
    </div>
  </div>
</div>
