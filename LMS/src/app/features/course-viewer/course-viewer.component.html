<div class="course-viewer-container">
  <div class="course-header">
    <div class="header-content">
      <h2>مشغل الدورة التدريبية</h2>
      <p *ngIf="courseId" class="course-id">رقم الدورة: {{ courseId }}</p>
    </div>
    <div class="header-actions">
      <button (click)="getCourseProgress()" class="btn btn-outline-primary">
        <i class="pi pi-refresh me-2"></i>
        تحديث التقدم
      </button>
    </div>
  </div>

  <div class="course-content">
    <div class="iframe-wrapper">
      <iframe
        #courseIframe
        [src]="courseUrl"
        width="100%"
        height="100%"
        frameborder="0"
        (load)="onIframeLoad()"
        allowfullscreen
        title="محتوى الدورة التدريبية"
      ></iframe>
    </div>
  </div>

  <div class="course-status" *ngIf="courseProgress">
    <div class="status-card">
      <h3>حالة التقدم</h3>
      <div class="progress-info">
        <div class="progress-bar">
          <div
            class="progress-fill"
            [style.width.%]="courseProgress.completionPercentage"
          ></div>
        </div>
        <span class="progress-text"
          >{{ courseProgress.completionPercentage }}%</span
        >
      </div>
      <p class="status-text">
        الحالة: {{ getStatusText(courseProgress.status) }}
      </p>
    </div>
  </div>
</div>
