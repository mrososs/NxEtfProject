<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCORM Course Wrapper</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      #course-container {
        width: 100%;
        height: 100vh;
        border: none;
      }
      #scorm-status {
        position: fixed;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 10px;
        border-radius: 5px;
        font-size: 12px;
        z-index: 9999;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="scorm-status">SCORM Wrapper Loaded</div>
    <iframe id="course-container" src="" frameborder="0"></iframe>

    <script src="/assets/scorm-wrapper.js"></script>
    <script>
      // Get course URL from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const courseUrl = urlParams.get('courseUrl');
      const courseId = urlParams.get('courseId');

      console.log('SCORM Course Wrapper loaded');
      console.log('Course URL:', courseUrl);
      console.log('Course ID:', courseId);

      if (courseUrl) {
        document.getElementById('course-container').src = courseUrl;
        document.getElementById('scorm-status').style.display = 'block';

        // Initialize SCORM wrapper with course ID
        if (courseId && window.ScormWrapper) {
          setTimeout(() => {
            console.log('Initializing SCORM wrapper with course ID:', courseId);
            // Send initialization message to parent
            window.parent.postMessage(
              {
                type: 'scorm_init',
                courseId: parseInt(courseId),
                apiEndpoint:
                  'https://etf-gtfrcrf9gaaceacg.centralus-01.azurewebsites.net/api/CourseTracker',
              },
              '*'
            );
          }, 1000);
        }
      } else {
        console.error('No course URL provided');
        document.body.innerHTML = '<h1>Error: No course URL provided</h1>';
      }

      // Listen for messages from parent
      window.addEventListener('message', function (event) {
        console.log('Received message from parent:', event.data);

        if (event.data.type === 'scorm_init') {
          console.log('SCORM initialized with course ID:', event.data.courseId);
        }
      });
    </script>
  </body>
</html>
